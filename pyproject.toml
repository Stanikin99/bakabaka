[tool.poetry]
name = "homeworkpoetry"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.16.0"

[tool.poetry.dependencies]


[tool.flake8]
max-line-length = 119
exclude = """ \\.git, __pycache__ """


[tool.black]
line-length = 119
exclude = """ \\.git """

[tool.isort]
line-length =119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = """ \\venv """




[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
